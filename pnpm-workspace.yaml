packages:
  - .

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  sharp: false

blockExoticSubdeps: true

minimumReleaseAge: 10080 # 7 days in minutes

minimumReleaseAgeExclude:
  - pnpm@12.18.0

overrides:
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  semver: '>=7'
  uuid: ^14.0.0

strictPeerDependencies: false

trustPolicy: no-downgrade
