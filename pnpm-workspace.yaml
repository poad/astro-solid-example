packages:
  - .

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  sharp: false

blockExoticSubdeps: true

minimumReleaseAge: 10080 # 7 days in minutes

minimumReleaseAgeExclude:
  - pnpm@12.15.0

overrides:
  semver: '>=7'
  uuid: ^14.0.0

strictPeerDependencies: false

trustPolicy: no-downgrade
